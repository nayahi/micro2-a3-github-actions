# Asincrónico 3 · Compila la solución y corre las pruebas en cada push.
# La prueba del JWT necesita el secreto JWT_CLAVE del repositorio (Settings → Secrets and variables → Actions).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:      # botón «Run workflow» en la pestaña Actions

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes
        run: dotnet restore ECommerceGRPC.slnx

      - name: Compilar
        run: dotnet build ECommerceGRPC.slnx -c Release --no-restore

      - name: Probar
        run: dotnet test Pruebas/ECommerceGRPC.Pruebas.csproj -c Release --no-build --logger "console;verbosity=normal"
        env:
          JWT_CLAVE: ${{ secrets.JWT_CLAVE }}
