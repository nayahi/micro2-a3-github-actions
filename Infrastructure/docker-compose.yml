# ECommerceGRPC · Clase 4 · Microservicios Resilientes (Nivel 2) · kit «solución»
#
#   docker compose up -d --build     → levanta todo (siempre con --build: así Docker usa SU código, no una imagen vieja)
#   docker compose ps                → estado de cada servicio
#   docker compose logs -f gateway   → mensajes del gateway
#   docker compose logs -f notification-service → lo que hace el consumidor de la cola
#   docker compose logs -f order-grpc  → los pasos de la saga (Clase 4)
#   docker compose down              → apaga (los datos se conservan)
#
# Afuera (su máquina)               Adentro (la red de Docker)
#   Gateway REST + Swagger  localhost:5000   gateway:5000        ← lo único que usa un cliente
#   Productos gRPC          localhost:7001   product-grpc:7001
#   Usuarios gRPC           localhost:7002   user-grpc:7002
#   Pedidos gRPC + saga     localhost:7003   order-grpc:7003
#   Pagos gRPC (Clase 4)    localhost:7004   payment-grpc:7004   simulado; apoyo en localhost:5004
#   Notificaciones (Clase 3) localhost:5003  notification-service:5003
#   LocalStack SNS/SQS (C3) localhost:4566   localstack:4566     cuenta 000000000000, región us-east-1
#   Catálogo REST (Nivel 1) localhost:5001   catalog-service:8080
#   Usuarios REST (Nivel 1) localhost:5002   user-service:8080
#   SQL Server              localhost,1434   sqlserver,1433      sa / Password123!
#
# Este kit usa su propio nombre de proyecto y sus propias imágenes (etiqueta :c4-solucion).
# Antes de levantarlo, apague cualquier otro kit del curso y el LocalStack del asincrónico 2: comparten los puertos.
name: ecommerce-grpc-c4-solucion

services:

  # Clase 3: AWS simulado (solo SNS y SQS). Al arrancar ejecuta init/crear-recursos.sh.
  localstack:
    image: localstack/localstack:4.14.0
    container_name: c4sol-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./init/crear-recursos.sh:/etc/localstack/init/ready.d/crear-recursos.sh:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: c4sol-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123!
      - MSSQL_PID=Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # REST del Nivel 1. Al arrancar crea CatalogDB con 3 productos.
  catalog-service:
    build:
      context: ..
      dockerfile: CatalogService/Dockerfile
    image: ecommerce-grpc/catalog-service:c4-solucion
    container_name: c4sol-catalog-rest
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=CatalogDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;Encrypt=False
      - Seq__Url=
      - Demo__ProductoLentoId=0
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # REST del Nivel 1. Al arrancar crea UserDB con 2 usuarios.
  user-service:
    build:
      context: ..
      dockerfile: UserService/Dockerfile
    image: ecommerce-grpc/user-service:c4-solucion
    container_name: c4sol-user-rest
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=UserDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;Encrypt=False
      - Seq__Url=
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  product-grpc:
    build:
      context: ../ProductService.gRPC
    image: ecommerce-grpc/product-grpc:c4-solucion
    container_name: c4sol-product-grpc
    environment:
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=CatalogDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;Encrypt=False
    ports:
      - "7001:7001"
    depends_on:
      catalog-service:
        condition: service_healthy

  # En la Clase 2 Usuarios gRPC arranca siempre (ya no lleva --profile usuarios).
  user-grpc:
    build:
      context: ../UserService.gRPC
    image: ecommerce-grpc/user-grpc:c4-solucion
    container_name: c4sol-user-grpc
    environment:
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=UserDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;Encrypt=False
    ports:
      - "7002:7002"
    depends_on:
      user-service:
        condition: service_healthy

  # Nuevo en la Clase 4: Pagos simulado (gRPC 7004). En 5004: GET /pagos y POST /simulacion/pagos?tasaRechazo=…
  payment-grpc:
    build:
      context: ../PaymentService.gRPC
    image: ecommerce-grpc/payment-grpc:c4-solucion
    container_name: c4sol-payment-grpc
    environment:
      - Simulacion__TasaRechazo=0
    ports:
      - "7004:7004"
      - "5004:5004"

  # Clase 2: valida pedidos. Clase 3: los crea y publica OrderCreated. Clase 4: orquesta la saga (lee pedidos-procesar).
  order-grpc:
    build:
      context: ../OrderService.gRPC
    image: ecommerce-grpc/order-grpc:c4-solucion
    container_name: c4sol-order-grpc
    environment:
      - GrpcServicios__Usuarios=http://user-grpc:7002
      - GrpcServicios__Productos=http://product-grpc:7001
      - GrpcServicios__Pagos=http://payment-grpc:7004
      - AWS__ServiceURL=http://localstack:4566
      - Mensajeria__TopicoPedidos=arn:aws:sns:us-east-1:000000000000:pedidos-creados
      - Mensajeria__ColaProcesar=pedidos-procesar
      - TZ=America/Costa_Rica            # hora local en los pasos de la saga
    ports:
      - "7003:7003"
    depends_on:
      product-grpc:
        condition: service_started
      user-grpc:
        condition: service_started
      payment-grpc:
        condition: service_started
      localstack:
        condition: service_healthy

  # Clase 3: consume la cola pedidos-notificar y «envía» la notificación de cada pedido.
  notification-service:
    build:
      context: ../NotificationService
    image: ecommerce-grpc/notification-service:c4-solucion
    container_name: c4sol-notification
    environment:
      - AWS__ServiceURL=http://localstack:4566
    ports:
      - "5003:5003"
    depends_on:
      localstack:
        condition: service_healthy

  # Clase 2: la única puerta de entrada para los clientes REST. Clase 4: Polly y /health/live, /health/ready.
  gateway:
    build:
      context: ../ApiGateway.BFF
    image: ecommerce-grpc/api-gateway:c4-solucion
    container_name: c4sol-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - GrpcServicios__Productos=http://product-grpc:7001
      - GrpcServicios__Usuarios=http://user-grpc:7002
      - GrpcServicios__Pedidos=http://order-grpc:7003
    ports:
      - "5000:5000"
    depends_on:
      - product-grpc
      - user-grpc
      - order-grpc

volumes:
  sqlserver-data:
