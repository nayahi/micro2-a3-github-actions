// OrderService.gRPC · contrato del servicio de Pedidos (Clase 3)
// Clase 2: ValidateOrder pregunta a Usuarios y a Productos.
// Clase 3: CreateOrder valida, asigna un número y PUBLICA el evento OrderCreated en SNS.
//          No espera a nadie: quien necesite saber del pedido se suscribe al tópico.
// Clase 4: el pedido nace PENDIENTE. La saga (OrquestadorSaga, en este mismo servicio) lee OrderCreated de la
//          cola pedidos-procesar, reserva el stock y cobra; termina CONFIRMADO o, si el pago se rechaza,
//          compensa (libera el stock) y queda CANCELADO. GetOrder muestra el estado y los pasos.
syntax = "proto3";

option csharp_namespace = "ECommerceGRPC.Orders";

package orders.v1;

service OrderService {
  // Unary. Revisa que el usuario exista y esté activo, y que cada producto
  // exista y tenga stock suficiente. Devuelve el total si todo está bien.
  rpc ValidateOrder (ValidateOrderRequest) returns (ValidateOrderReply);

  // Unary. Valida como ValidateOrder; si el pedido es válido le asigna un número
  // y publica OrderCreated en el tópico SNS «pedidos-creados». Si no es válido,
  // responde FAILED_PRECONDITION con los problemas y no publica nada.
  rpc CreateOrder (ValidateOrderRequest) returns (CreateOrderReply);

  // Clase 4 · Unary. Estado del pedido en la saga y los pasos que lleva. NOT_FOUND si no existe.
  rpc GetOrder (GetOrderRequest) returns (OrderStatusReply);
}

message OrderItem {
  int32 product_id = 1;
  int32 quantity = 2;
}

message ValidateOrderRequest {
  int32 user_id = 1;
  repeated OrderItem items = 2;
}

message ValidateOrderReply {
  bool is_valid = 1;
  repeated string problems = 2;   // vacío si el pedido es válido
  double total = 3;               // suma de precio × cantidad de los productos válidos
}

message CreateOrderReply {
  int32 order_id = 1;
  double total = 2;
  string event_id = 3;            // identificador del evento publicado (sirve para detectar duplicados)
}

// ── Clase 4 · Saga ─────────────────────────────────────────────────────────
message GetOrderRequest {
  int32 order_id = 1;
}

message OrderStatusReply {
  int32 order_id = 1;
  int32 user_id = 2;
  string status = 3;           // PENDIENTE, CONFIRMADO o CANCELADO
  double total = 4;
  repeated string steps = 5;   // «hh:mm:ss · qué pasó», en orden
}
