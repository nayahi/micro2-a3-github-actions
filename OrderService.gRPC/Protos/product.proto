// ProductService.gRPC · contrato del servicio de Productos (Clase 1)
// Clase 4: ReserveStock y ReleaseStock son los pasos de Inventario en la saga del pedido.
// Es el mismo catálogo de CatalogService (REST): misma base CatalogDB, otro protocolo.
syntax = "proto3";

option csharp_namespace = "ECommerceGRPC.Products";

package products.v1;

service ProductService {
  // Unary: una petición, una respuesta. Equivale a GET /api/products/{id}.
  rpc GetProduct (GetProductRequest) returns (ProductReply);

  // Server streaming: una petición, varias respuestas, una por producto.
  rpc ListProducts (ListProductsRequest) returns (stream ProductReply);

  // Unary. Equivale a POST /api/products.
  rpc CreateProduct (CreateProductRequest) returns (ProductReply);

  // Unary. Cambia el stock y avisa a quien esté mirando ese producto (WatchStock).
  rpc UpdateStock (UpdateStockRequest) returns (ProductReply);

  // Server streaming en tiempo real: la respuesta queda abierta y envía
  // un mensaje cada vez que cambia el stock del producto.
  rpc WatchStock (WatchStockRequest) returns (stream StockUpdate);

  // Clase 4 · Saga, paso 1 (Inventario). Unary. Descuenta el stock de todas las líneas del pedido.
  // Idempotente por order_id: si el pedido ya tiene reserva, no descuenta otra vez (already_reserved = true).
  // Si alguna línea no alcanza, responde FAILED_PRECONDITION y no descuenta nada.
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockReply);

  // Clase 4 · Compensación del paso 1. Unary. Devuelve el stock que reservó el pedido.
  // Idempotente: si el pedido no tiene reserva (nunca la tuvo o ya se liberó), no hace nada (released = false).
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockReply);
}

message GetProductRequest {
  int32 id = 1;
}

message ListProductsRequest {
  string category = 1;   // vacío = todas las categorías
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;      // proto3 no tiene decimal: el precio viaja como double
  int32 stock = 4;
  string category = 5;
}

message UpdateStockRequest {
  int32 id = 1;
  int32 stock = 2;
}

message WatchStockRequest {
  int32 id = 1;
}

message ProductReply {
  int32 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
  string category = 6;
  bool is_active = 7;
}

message StockUpdate {
  int32 id = 1;
  string name = 2;
  int32 old_stock = 3;
  int32 new_stock = 4;
  string changed_at = 5;  // fecha y hora UTC, formato ISO 8601
}

// ── Clase 4 · Saga ─────────────────────────────────────────────────────────
message StockLine {
  int32 product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  int32 order_id = 1;
  repeated StockLine lines = 2;
}

message ReserveStockReply {
  bool already_reserved = 1;   // true = la reserva ya existía (el mensaje llegó otra vez)
}

message ReleaseStockRequest {
  int32 order_id = 1;
}

message ReleaseStockReply {
  bool released = 1;           // false = no había reserva que liberar
}
